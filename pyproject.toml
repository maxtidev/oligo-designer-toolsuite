[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["oligo_designer_toolsuite"]

[tool.setuptools_scm]
write_to = "oligo_designer_toolsuite/_version.py"
local_scheme = "no-local-version"

[project]
name = "oligo-designer-toolsuite"
dynamic = ["version"]
description = "Oligo Designer Toolsuite: lightweight development of custom oligo design pipelines"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Lisa Barros de Andrade e Sousa", email = "lisa.barros.andrade.sousa@gmail.com" },
  { name = "Isra Mekki" },
  { name = "Francesco Campi" },
  { name = "Chelsea Bright" },
  { name = "Louis Kümmerle" },
  { name = "Jonas Hagenberg" },
]
maintainers = [
  { name = "Lisa Barros de Andrade e Sousa", email = "lisa.barros.andrade.sousa@gmail.com" },
  { name = "Jonas Hagenberg", email = "jonas.hagenberg@helmholtz-muenchen.de" },
]
keywords = [
  "oligo design",
  "high throughput genomics",
  "spatial transcriptomics",
  "bioinformatics",
  "reproducible research",
  "workflow automation",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bioinformatics",
]
dependencies = [
  "biopython>=1.86,<2",
  "cyvcf2>=0.32,<1",
  "effidict>=0.0.10,<1",
  "ipywidgets>=8.1,<9",
  "joblib>=1.4,<2",
  "joblib_progress>=1.0,<2",
  "networkx>=3.2,<3.4",
  "numpy>=1.26,<3",
  "oligo-designer-toolsuite-ai-filters",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pydantic>=2.12.5,<3",
  "pyyaml>=6.0,<7",
  "scipy>=1.13,<2",
  "seqfold>=0.9,<1",
  "filelock>=3",
]

[dependency-groups]
test = ["pytest>=7,<9", "coverage[toml]>=7,<8"]
lint = [
  "pre-commit>=3,<5",
  "ruff==0.16.0",
  "pyrefly==1.2.0",
]
types = [
  "types-PyYAML",
  "types-setuptools",
  "types-networkx",
  "pandas-stubs",
  "scipy-stubs",
]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "types" },
]

[project.scripts]
genomic_region_generator = "oligo_designer_toolsuite.pipelines._genomic_region_generator:main"
oligo_seq_probe_designer = "oligo_designer_toolsuite.pipelines._oligo_seq_probe_designer:main"
scrinshot_probe_designer = "oligo_designer_toolsuite.pipelines._scrinshot_probe_designer:main"
seqfish_plus_probe_designer = "oligo_designer_toolsuite.pipelines._seqfish_plus_probe_designer:main"
merfish_probe_designer = "oligo_designer_toolsuite.pipelines._merfish_probe_designer:main"
cycle_hcr_probe_designer = "oligo_designer_toolsuite.pipelines._cycle_hcr_probe_designer:main"
hcr_probe_designer = "oligo_designer_toolsuite.pipelines._hcr_probe_designer:main"

[project.urls]
documentation = "https://oligo-designer-toolsuite.readthedocs.io/"
repository = "https://github.com/HelmholtzAI-Consultants-Munich/oligo-designer-toolsuite"


[tool.pytest.ini_options]
filterwarnings = ["ignore::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Extra rules that Ruff will apply
# see https://docs.astral.sh/ruff/rules
extend-select = [
  "RUF", # ruff-specific rules
  "UP",  # pyupgrade
  "I",   # isort
]

[tool.pyrefly]
python-version = "3.12.0"
preset = "legacy"
ignore-missing-imports = [
  "effidict.*",
  "joblib.*",
  "cyvcf2.*",
  "seqfold.*",
  "joblib_progress.*",
  "oligo_designer_toolsuite_ai_filters.*",
  "biopython.*",
  "bio.*",
]
project-excludes = ["*.ipynb"]
